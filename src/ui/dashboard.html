<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>数据集成 Agent 监控</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8;
          --ok:#22c55e; --err:#ef4444; --run:#f59e0b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; padding:24px; }
  h1 { font-size:20px; margin-bottom:16px; }
  h1 span { color:var(--muted); font-size:14px; font-weight:normal; margin-left:8px; }
  .cards { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 20px; min-width:120px; }
  .card .num { font-size:26px; font-weight:600; }
  .card .label { font-size:12px; color:var(--muted); margin-top:4px; }
  .card.ok .num { color:var(--ok); } .card.err .num { color:var(--err); } .card.run .num { color:var(--run); }
  .card.warn .num { color:#eab308; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; }
  th,td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); font-size:13px; }
  th { color:var(--muted); font-weight:500; background:rgba(255,255,255,.03); }
  tr:hover td { background:rgba(255,255,255,.04); cursor:pointer; }
  .tag { padding:2px 10px; border-radius:999px; font-size:12px; }
  .tag.success,.tag.exec_done,.tag.config_done { background:rgba(34,197,94,.15); color:var(--ok); }
  .tag.failed { background:rgba(239,68,68,.15); color:var(--err); }
  .tag.running,.tag.executing,.tag.validating { background:rgba(245,158,11,.15); color:var(--run); }
  .tag.pending,.tag.pending_approval { background:rgba(234,179,8,.15); color:#eab308; }
  .btn-approve,.btn-reject { padding:3px 12px; border:none; border-radius:6px; cursor:pointer; font-size:12px; margin-right:6px; }
  .btn-approve { background:rgba(34,197,94,.2); color:var(--ok); }
  .btn-reject { background:rgba(239,68,68,.2); color:var(--err); }
  .query { max-width:380px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #logModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; }
  #logModal .panel { background:#0b1220; border:1px solid var(--border); border-radius:12px; max-width:760px;
                     margin:8vh auto; max-height:80vh; overflow:auto; padding:20px; }
  #logModal h3 { margin-bottom:12px; font-size:15px; }
  #logModal pre { font-size:12px; line-height:1.6; color:#cbd5e1; white-space:pre-wrap; word-break:break-all; }
  #logModal .close { float:right; cursor:pointer; color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:30px; }
</style>
</head>
<body>
  <h1>数据集成 Agent 监控<span id="refreshed">加载中…</span></h1>
  <div class="cards" id="cards"></div>
  <table>
    <thead><tr><th>任务 ID</th><th>指令</th><th>状态</th><th>创建时间</th><th>耗时</th><th>错误</th><th>操作</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div id="logModal"><div class="panel">
    <span class="close" onclick="document.getElementById('logModal').style.display='none'">✕</span>
    <h3 id="logTitle">任务日志</h3>
    <pre id="logBody">加载中…</pre>
  </div></div>

<script>
async function load() {
  const resp = await fetch('/tasks?limit=50');
  const data = await resp.json();
  const tasks = data.tasks || [];
  renderCards(tasks);
  renderRows(tasks);
  document.getElementById('refreshed').textContent =
    '更新于 ' + new Date().toLocaleTimeString();
}

function renderCards(tasks) {
  const count = s => tasks.filter(t => t.status === s).length;
  const cards = [
    { label: '总数', num: tasks.length, cls: '' },
    { label: '待审批', num: count('pending_approval'), cls: 'warn' },
    { label: '成功', num: count('success'), cls: 'ok' },
    { label: '失败', num: count('failed'), cls: 'err' },
    { label: '运行中', num: tasks.length - count('success') - count('failed') - count('cancelled') - count('pending_approval'), cls: 'run' },
  ];
  document.getElementById('cards').innerHTML = cards.map(c =>
    `<div class="card ${c.cls}"><div class="num">${c.num}</div><div class="label">${c.label}</div></div>`
  ).join('');
}

function renderRows(tasks) {
  const tbody = document.getElementById('rows');
  if (!tasks.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无任务</td></tr>';
    return;
  }
  tbody.innerHTML = tasks.map(t => {
    const dur = t.completed_at && t.created_at ?
      ((new Date(t.completed_at) - new Date(t.created_at)) / 1000).toFixed(1) + 's' : '—';
    const approveBtn = t.status === 'pending_approval' ? `
      <button class="btn-approve" onclick="event.stopPropagation(); approve('${t.task_id}')">通过</button>
      <button class="btn-reject" onclick="event.stopPropagation(); reject('${t.task_id}')">拒绝</button>` : '';
    return `<tr onclick="showLog('${t.task_id}')">
      <td>${t.task_id}</td>
      <td class="query" title="${escapeHtml(t.user_query || '')}">${escapeHtml(t.user_query || '')}</td>
      <td><span class="tag ${t.status}">${t.status}</span></td>
      <td>${(t.created_at || '').slice(0, 19).replace('T', ' ')}</td>
      <td>${dur}</td>
      <td style="color:var(--err)">${escapeHtml(t.error || '')}</td>
      <td>${approveBtn}</td>
    </tr>`;
  }).join('');
}

async function approve(taskId) {
  if (!confirm('确认执行该任务？')) return;
  const resp = await fetch('/tasks/' + taskId + '/approve', { method: 'POST' });
  const data = await resp.json();
  alert(resp.ok ? '已通过并执行: ' + (data.status || '') : '审批失败: ' + (data.detail || resp.status));
  load();
}

async function reject(taskId) {
  if (!confirm('确认拒绝执行该任务？')) return;
  const resp = await fetch('/tasks/' + taskId + '/reject', { method: 'POST' });
  const data = await resp.json();
  alert(resp.ok ? '已拒绝执行' : '拒绝失败: ' + (data.detail || resp.status));
  load();
}

async function showLog(taskId) {
  const modal = document.getElementById('logModal');
  document.getElementById('logTitle').textContent = '任务 ' + taskId + ' 日志';
  modal.style.display = 'block';
  try {
    const resp = await fetch('/tasks/' + taskId + '/logs');
    const data = await resp.json();
    document.getElementById('logBody').textContent =
      (data.logs || []).map(l => `[${l.level}] ${l.created_at.slice(0,19).replace('T',' ')} ${l.message}`).join('\n')
      || '（无日志）';
  } catch (e) {
    document.getElementById('logBody').textContent = '获取日志失败: ' + e;
  }
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

load();
setInterval(load, 10000);
</script>
</body>
</html>
