<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗄️</text></svg>">
<title>数仓多 Agent 协作平台 · 全链路监控</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8;
          --ok:#22c55e; --err:#ef4444; --run:#f59e0b; --accent:#38bdf8; --warn:#eab308;
          --hover:rgba(255,255,255,.05); --shadow:0 4px 16px rgba(0,0,0,.25); }
  :root[data-theme="light"] { --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0; --text:#0f172a;
          --muted:#64748b; --ok:#16a34a; --err:#dc2626; --run:#d97706; --accent:#0284c7;
          --warn:#ca8a04; --hover:rgba(15,23,42,.05); --shadow:0 2px 10px rgba(15,23,42,.08); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
         display:flex; min-height:100vh; }
  .layout { display:flex; width:100%; min-height:100vh; }
  .sidebar { width:220px; flex-shrink:0; background:var(--card); border-right:1px solid var(--border);
             display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .sidebar .brand { padding:18px 16px 14px; border-bottom:1px solid var(--border); }
  .sidebar .brand .logo { font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .sidebar .brand .logo .dot { width:10px; height:10px; border-radius:50%;
                               background:linear-gradient(135deg,var(--accent),#6366f1); box-shadow:0 0 8px var(--accent); }
  .sidebar .brand small { display:block; color:var(--muted); font-size:11.5px; margin-top:4px; }
  .sidebar nav { flex:1; padding:10px 8px; display:flex; flex-direction:column; gap:2px; }
  .sidebar nav button { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
                         background:none; border:none; color:var(--muted); padding:10px 12px;
                         border-radius:8px; cursor:pointer; font-size:13.5px; transition:all .15s; }
  .sidebar nav button:hover { background:var(--hover); color:var(--text); }
  .sidebar nav button.active { background:rgba(56,189,248,.12); color:var(--accent); font-weight:600; }
  .sidebar nav button .ico { width:18px; text-align:center; font-size:14px; }
  .sidebar .side-foot { padding:12px 16px; border-top:1px solid var(--border); font-size:11.5px;
                         color:var(--muted); display:flex; align-items:center; gap:8px; }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 24px;
            border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:0; z-index:5; }
  .topbar .page-title { font-size:17px; font-weight:600; }
  .topbar .page-title small { color:var(--muted); font-size:12px; font-weight:normal; margin-left:8px; }
  .topbar .spacer { flex:1; }
  .topbar .controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .btn-wizard { background:linear-gradient(135deg,#38bdf8,#6366f1); border:none; color:#fff; font-weight:600;
                padding:8px 18px; border-radius:9px; cursor:pointer; font-size:13px;
                box-shadow:0 4px 14px rgba(56,189,248,.35); transition:transform .12s, box-shadow .12s; }
  .btn-wizard:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(56,189,248,.45); }
  .content { padding:20px 24px 32px; }
  .status-strip { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .status-pill { background:var(--card); border:1px solid var(--border); border-radius:999px;
                 padding:5px 14px; font-size:12.5px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  .status-pill b { color:var(--text); }
  .status-pill .ok { color:var(--ok); } .status-pill .err { color:var(--err); }
  .status-pill .run { color:var(--run); } .status-pill .warn { color:var(--warn); }
  input,select,button { font-family:inherit; }
  .input, .select { background:var(--card); border:1px solid var(--border); color:var(--text);
                     border-radius:8px; padding:6px 10px; font-size:12.5px; }
  .btn { padding:6px 14px; border:1px solid var(--border); background:var(--card); color:var(--text);
         border-radius:8px; cursor:pointer; font-size:12.5px; transition:opacity .15s; }
  .btn:hover { opacity:.85; }
  .btn-ghost { color:var(--muted); }
  .btn-approve { background:rgba(34,197,94,.18); border-color:transparent; color:var(--ok); }
  .btn-reject { background:rgba(239,68,68,.18); border-color:transparent; color:var(--err); }
  .btn-action { background:rgba(56,189,248,.15); border-color:transparent; color:var(--accent); }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { background:var(--card); border:1px solid var(--border); color:var(--muted); border-radius:8px;
                 padding:7px 20px; cursor:pointer; font-size:13px; }
  .tabs button.active { color:var(--accent); border-color:var(--accent); background:rgba(56,189,248,.08); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 18px;
          cursor:pointer; transition:border-color .15s, transform .1s; box-shadow:var(--shadow); }
  .card:hover { transform:translateY(-1px); }
  .card.active { border-color:var(--accent); outline:2px solid rgba(56,189,248,.35); }
  .card .num { font-size:26px; font-weight:600; }
  .card .label { font-size:12px; color:var(--muted); margin-top:2px; }
  .card.ok .num { color:var(--ok); } .card.err .num { color:var(--err); }
  .card.run .num { color:var(--run); } .card.warn .num { color:var(--warn); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .toolbar .grow { flex:1; }
  .toolbar .search { min-width:220px; }
  .table-wrap { overflow-x:auto; background:var(--card); border:1px solid var(--border);
                 border-radius:10px; box-shadow:var(--shadow); }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--border); font-size:12.5px;
          white-space:nowrap; }
  th { color:var(--muted); font-weight:500; background:rgba(128,128,128,.06); position:sticky; top:0; }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:var(--accent); }
  tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background:var(--hover); cursor:pointer; }
  .query-cell { max-width:340px; overflow:hidden; text-overflow:ellipsis; }
  .err-cell { max-width:220px; overflow:hidden; text-overflow:ellipsis; color:var(--err); }
  .tag { padding:2px 10px; border-radius:999px; font-size:11.5px; white-space:nowrap; }
  .tag.success,.tag.exec_done,.tag.config_done { background:rgba(34,197,94,.15); color:var(--ok); }
  .tag.failed { background:rgba(239,68,68,.15); color:var(--err); }
  .tag.running,.tag.executing,.tag.validating { background:rgba(245,158,11,.15); color:var(--run); }
  .tag.pending,.tag.pending_approval { background:rgba(234,179,8,.15); color:var(--warn); }
  .tag.cancelled { background:rgba(148,163,184,.15); color:var(--muted); }
  .tag.type { background:rgba(56,189,248,.12); color:var(--accent); }
  .pager { display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .pager .info { color:var(--muted); font-size:12.5px; }
  .pager .pages { display:flex; gap:4px; }
  .pager button { min-width:30px; }
  .pager button.cur { background:var(--accent); border-color:var(--accent); color:#fff; }
  .empty { text-align:center; color:var(--muted); padding:36px; }
  .tree-row td:first-child { padding-left:8px; }
  .tree-child td:first-child { padding-left:36px; position:relative; }
  .tree-child td:first-child::before { content:"└─"; position:absolute; left:14px; color:var(--muted); }
  #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; }
  #modal .panel { background:var(--card); border:1px solid var(--border); border-radius:12px; max-width:880px;
                  margin:4vh auto; max-height:92vh; overflow:auto; padding:22px; box-shadow:var(--shadow); }
  #modal h3 { margin-bottom:10px; font-size:16px; }
  #modal .close { float:right; cursor:pointer; color:var(--muted); font-size:20px; }
  #modal pre { font-size:12px; line-height:1.6; color:var(--muted); white-space:pre-wrap; word-break:break-all; }
  .section-title { font-size:13px; color:var(--muted); margin:16px 0 8px; font-weight:600; }
  .timeline { border-left:2px solid var(--border); padding-left:16px; }
  .tl-item { position:relative; padding:6px 0; font-size:12.5px; }
  .tl-item::before { content:""; position:absolute; left:-21px; top:12px; width:8px; height:8px; border-radius:50%;
                     background:var(--accent); }
  .tl-item .t { color:var(--muted); font-size:11.5px; margin-right:8px; white-space:nowrap; }
  .tl-item .d { color:var(--accent); font-size:11.5px; }
  .actions-bar { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  .health-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  .health-item { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .health-item .name { font-size:14px; font-weight:600; }
  .health-item .st { font-size:12px; margin-top:6px; }
  .health-item.ok .st { color:var(--ok); } .health-item.bad .st { color:var(--err); }
  .audit-detail { color:var(--muted); font-size:11.5px; word-break:break-all; }
  .refresh-note { color:var(--muted); font-size:12px; }
  .detail-meta { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:12.5px; margin-top:6px; }
  .route-card { display:flex; align-items:stretch; gap:0; background:var(--bg); border:1px solid var(--border);
                border-radius:10px; padding:12px 14px; margin-top:6px; }
  .route-side { flex:1; min-width:0; }
  .route-side .route-label { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .route-side .route-name { font-size:13.5px; font-weight:600; }
  .route-side .route-detail { font-size:12px; color:var(--muted); margin-top:3px; word-break:break-all; }
  .route-arrow { display:flex; align-items:center; padding:0 16px; color:var(--accent); font-size:18px; }
  .query-cell .route-mini { display:block; color:var(--muted); font-size:11.5px; margin-top:3px; }
  .detail-overview { background:var(--bg); border:1px solid var(--border); border-radius:10px;
                     padding:14px 16px; margin-bottom:14px; }
  .detail-query { font-size:14px; font-weight:600; margin-bottom:10px; }
  .cfg-tabs { display:flex; gap:6px; margin:14px 0 10px; flex-wrap:wrap; }
  .cfg-tabs button { background:var(--bg); border:1px solid var(--border); color:var(--muted);
                     border-radius:8px; padding:6px 14px; cursor:pointer; font-size:12.5px; }
  .cfg-tabs button.active { color:var(--accent); border-color:var(--accent); background:rgba(56,189,248,.08); }
  .cfg-pane { display:none; }
  .cfg-pane.active { display:block; }
  .mapping-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .mapping-table td { padding:7px 10px; border-bottom:1px solid var(--border); }
  .mapping-table tr:last-child td { border-bottom:none; }
  .mapping-table .src { text-align:right; color:var(--text); }
  .mapping-table .src .t { color:var(--muted); font-size:11px; margin-left:6px; }
  .mapping-table .mid { text-align:center; color:var(--accent); width:56px; white-space:nowrap; }
  .mapping-table .dst { color:var(--text); }
  .mapping-table .dst .t { color:var(--muted); font-size:11px; margin-left:6px; }
  .where-box { background:var(--bg); border:1px solid var(--border); border-radius:8px;
               padding:10px 14px; font-family:Consolas,monospace; font-size:12.5px;
               color:var(--text); word-break:break-all; }
  .cfg-edit { width:100%; min-height:260px; background:var(--bg); border:1px solid var(--border);
              color:var(--text); border-radius:8px; padding:12px; font-family:Consolas,monospace;
              font-size:12px; resize:vertical; white-space:pre; }
  .cfg-edit:focus { outline:2px solid rgba(56,189,248,.35); border-color:var(--accent); }
  .cfg-actions { display:flex; gap:8px; margin-top:10px; justify-content:flex-end; }
  .muted-flag { color:var(--muted); font-size:11.5px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-top:12px; }
  .form-grid label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .form-grid .full { grid-column:1 / -1; }
  .form-actions { display:flex; gap:8px; margin-top:14px; justify-content:flex-end; }
  .test-result { font-size:12px; margin-top:8px; }
  .test-result.ok { color:var(--ok); } .test-result.bad { color:var(--err); }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="dot"></span>数仓平台</div>
      <small>多 Agent 协作 · 全链路监控</small>
    </div>
    <nav>
      <button data-tab="tasks" class="active"><span class="ico">▤</span>任务</button>
      <button data-tab="pipelines"><span class="ico">⛓</span>管道</button>
      <button data-tab="audit"><span class="ico">◷</span>审计</button>
      <button data-tab="health"><span class="ico">❤</span>组件健康</button>
      <button data-tab="datasources"><span class="ico">🗄</span>数据源</button>
    </nav>
    <div class="side-foot"><span style="width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)"></span> 服务运行中</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="page-title">全链路监控<small>任务 · 管道 · 审计 · 健康 · 数据源</small></div>
      <div class="spacer"></div>
      <div class="controls">
        <span class="refresh-note" id="refreshed">加载中…</span>
        <button class="btn btn-ghost" onclick="loadAll()">刷新</button>
        <button class="btn-wizard" onclick="location.href='/ui/wizard'">⚡ 同步向导</button>
        <button class="btn btn-ghost" id="themeToggle" onclick="toggleTheme()">☀️</button>
        <span style="display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px">
          Token <input type="password" class="input" id="apiToken" placeholder="API_TOKEN（可选）" style="width:150px">
        </span>
        <a href="/chat" target="_blank" style="color:var(--accent);font-size:13px">去交互 ↗</a>
      </div>
    </div>
  <div class="content">

  <div id="tab-tasks">
    <div class="cards" id="cards"></div>
    <div class="toolbar">
      <input class="input search" id="search" placeholder="搜索：任务ID / 指令 / 表名…">
      <select class="select" id="filterStatus">
        <option value="all">全部状态</option>
        <option value="pending_approval">待审批</option>
        <option value="running">运行中</option>
        <option value="success">成功</option>
        <option value="failed">失败</option>
        <option value="cancelled">已取消</option>
      </select>
      <select class="select" id="filterType">
        <option value="all">全部类型</option>
        <option value="data_integration">数据集成</option>
        <option value="etl_development">ETL</option>
        <option value="data_ops">运维</option>
      </select>
      <select class="select" id="filterTime">
        <option value="all">全部时间</option>
        <option value="today">今天</option>
        <option value="24h">最近 24 小时</option>
        <option value="7d">最近 7 天</option>
      </select>
      <button class="btn btn-ghost" onclick="clearFilters()">清除筛选</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>任务 ID</th><th>类型</th><th>指令</th><th>状态</th>
          <th class="sortable" onclick="toggleSort('created_at')">创建时间<span id="arr-created_at"></span></th>
          <th>完成时间</th>
          <th class="sortable" onclick="toggleSort('duration')">耗时<span id="arr-duration"></span></th>
          <th>错误</th><th>操作</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="9" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>

  <div id="tab-pipelines" style="display:none">
    <div class="table-wrap">
      <table>
        <thead><tr><th>管道 / 任务</th><th>状态</th><th>源 → 目标</th>
          <th>创建时间</th><th>完成时间</th><th>耗时</th><th>错误</th></tr></thead>
        <tbody id="pipelineRows"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-audit" style="display:none">
    <div class="table-wrap">
      <table>
        <thead><tr><th>时间</th><th>任务 ID</th><th>动作</th><th>操作人</th><th>详情</th></tr></thead>
        <tbody id="auditRows"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-health" style="display:none">
    <div class="actions-bar"><button class="btn btn-action" onclick="loadHealth()">刷新健康检查</button></div>
    <div class="health-grid" id="healthGrid" style="margin-top:12px"></div>
  </div>

  <div id="tab-datasources" style="display:none">
    <div class="toolbar">
      <button class="btn btn-action" onclick="openDsForm()">+ 新增数据源</button>
      <span class="refresh-note">密码仅写入不回显；测试连接使用已保存的凭据</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>名称</th><th>类型</th><th>主机:端口</th><th>库</th>
          <th>备注</th><th>密码</th><th>操作</th></tr></thead>
        <tbody id="dsRows"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="modal">
    <div class="panel">
      <span class="close" onclick="closeModal()">✕</span>
      <h3 id="detailTitle">任务详情</h3>
      <div id="detailBody"></div>
      <div class="actions-bar" id="detailActions"></div>
    </div>
  </div>

  <div id="dsModal" style="display:none">
    <div class="panel">
      <span class="close" onclick="closeDsModal()">✕</span>
      <h3 id="dsTitle">新增数据源</h3>
      <form id="dsForm" onsubmit="saveDs(event)">
        <input type="hidden" id="dsId">
        <div class="form-grid">
          <label>名称 *<input class="input" id="dsName" placeholder="如：生产MySQL"></label>
          <label>类型 *<select class="select" id="dsType">
            <option value="mysql">MySQL</option>
            <option value="mongodb">MongoDB</option>
            <option value="elasticsearch">Elasticsearch</option>
            <option value="starrocks">StarRocks</option>
          </select></label>
          <label>主机 *<input class="input" id="dsHost" placeholder="127.0.0.1"></label>
          <label>端口 *<input class="input" id="dsPort" type="number" value="3306"></label>
          <label>用户名<input class="input" id="dsUser" placeholder="root"></label>
          <label>密码<input class="input" id="dsPass" type="password" placeholder="留空=保留原密码"></label>
          <label>默认库<input class="input" id="dsDb" placeholder="如：datax_test"></label>
          <label>备注<input class="input" id="dsRemark" placeholder="用途说明"></label>
        </div>
        <div class="test-result" id="dsTestResult"></div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="testDsFields()">测试连接</button>
          <button type="button" class="btn btn-ghost" onclick="closeDsModal()">取消</button>
          <button type="submit" class="btn btn-action">保存</button>
        </div>
      </form>
    </div>
  </div>

  </div>
  </div>
</div>

<script>
// URL 参数 ?wizard=1 时跳转到独立同步向导页（供 chat 页入口跳转）
window.addEventListener('DOMContentLoaded', () => {
  if (new URLSearchParams(location.search).get('wizard') === '1') {
    location.href = '/ui/wizard';
  }
});

const $ = id => document.getElementById(id);
const TOKEN_KEY = 'dataagent_api_token';
const TYPE_LABELS = { data_integration:'数据集成', etl_development:'ETL', data_ops:'运维', data_analysis:'分析' };
const DBTYPE_LABELS = { mysql:'MySQL', mongodb:'MongoDB', elasticsearch:'Elasticsearch', starrocks:'StarRocks' };
const state = { status:'all', type:'all', q:'', time:'all', sort:'created_at', order:'desc',
                page:1, size:20, tab:'tasks' };

function token() { return $('apiToken').value || localStorage.getItem(TOKEN_KEY) || ''; }
function headers() { const t = token(); return t ? {'X-API-Token': t} : {}; }
function escapeHtml(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function api(url, opts) {
  const r = await fetch(url, Object.assign({headers: headers()}, opts || {}));
  if (r.status === 401) { alert('未授权：请在右上角填入 API_TOKEN'); throw new Error('unauthorized'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { throw new Error(data.detail || ('HTTP ' + r.status)); }
  return data;
}

function statusText(s) {
  return {pending_approval:'待审批', success:'成功', failed:'失败', cancelled:'已取消',
          running:'运行中', executing:'执行中', validating:'校验中', config_done:'配置完成',
          exec_done:'执行完成', pending:'排队'}[s] || s;
}
function durationSec(a, b) {
  if (!a || !b) return '—';
  return ((new Date(b) - new Date(a)) / 1000).toFixed(1) + 's';
}
function fmtTime(t) { return (t || '').slice(0, 19).replace('T', ' '); }

// ---------- 主题 ----------
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
}
function initTheme() {
  const saved = localStorage.getItem('dataagent_theme');
  const theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(theme);
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('dataagent_theme', next);
}

// ---------- 数据加载 ----------
function timeRange() {
  const now = new Date();
  if (state.time === 'today') { const s = new Date(now); s.setHours(0,0,0,0); return {from:s.toISOString()}; }
  if (state.time === '24h') return {from:new Date(now - 86400000).toISOString()};
  if (state.time === '7d') return {from:new Date(now - 7*86400000).toISOString()};
  return {};
}
function tasksUrl() {
  const p = new URLSearchParams();
  if (state.status !== 'all') p.set('status', state.status);
  if (state.type !== 'all') p.set('task_type', state.type);
  if (state.q) p.set('query', state.q);
  const tr = timeRange(); if (tr.from) p.set('from', tr.from);
  p.set('sort_by', state.sort); p.set('order', state.order);
  p.set('limit', state.size); p.set('offset', (state.page - 1) * state.size);
  return '/tasks/detail?' + p.toString();
}

function taskActions(t, withRow = true) {
  let b = '';
  if (t.status === 'pending_approval') {
    b += `<button class="btn btn-approve" onclick="event.stopPropagation();doApprove('${t.task_id}')">通过</button>`;
    b += `<button class="btn btn-reject" onclick="event.stopPropagation();doReject('${t.task_id}')">拒绝</button>`;
  }
  if (t.status === 'failed' || t.status === 'cancelled') {
    b += `<button class="btn btn-action" onclick="event.stopPropagation();doRetry('${t.task_id}')">重试</button>`;
    if (t.status === 'failed') {
      b += `<button class="btn btn-action" onclick="event.stopPropagation();doDiagnose('${t.task_id}')">运维诊断</button>`;
    }
  }
  if (withRow) b += `<button class="btn btn-action" onclick="event.stopPropagation();showDetail('${t.task_id}')">详情</button>`;
  return b || '—';
}

const CARD_DEFS = [
  {key:'total', label:'总数'},
  {key:'pending_approval', label:'待审批', filter:'pending_approval'},
  {key:'running', label:'运行中', filter:'running'},
  {key:'success', label:'成功', filter:'success'},
  {key:'failed', label:'失败', filter:'failed'},
];
function renderCards(counts) {
  $('cards').innerHTML = CARD_DEFS.map(c => {
    const active = c.filter && state.status === c.filter;
    return `<div class="card ${c.cls || ''} ${active ? 'active' : ''}" onclick="cardClick('${c.filter || ''}')">
      <div class="num">${counts[c.key] ?? 0}</div><div class="label">${c.label}</div></div>`;
  }).join('');
}
function cardClick(filter) {
  state.status = state.status === filter ? 'all' : filter;
  state.page = 1;
  $('filterStatus').value = state.status;
  loadTasks();
}

function renderTasks(tasks) {
  const tbody = $('rows');
  if (!tasks.length) { tbody.innerHTML = '<tr><td colspan="9" class="empty">暂无任务</td></tr>'; return; }
  tbody.innerHTML = tasks.map(t => {
    const type = TYPE_LABELS[t.task_type] || escapeHtml(t.task_type || '—');
    const route = syncRoute(t);
    return `<tr onclick="showDetail('${t.task_id}')">
      <td>${t.task_id}</td>
      <td><span class="tag type">${type}</span></td>
      <td class="query-cell" title="${escapeHtml(t.user_query)}">${escapeHtml(t.user_query)}
        ${route ? `<span class="route-mini">↔ ${escapeHtml(route)}</span>` : ''}</td>
      <td><span class="tag ${t.status}">${statusText(t.status)}</span></td>
      <td>${fmtTime(t.created_at)}</td>
      <td>${fmtTime(t.completed_at) || '—'}</td>
      <td>${durationSec(t.created_at, t.completed_at)}</td>
      <td class="err-cell" title="${escapeHtml(t.error || '')}">${escapeHtml(t.error || '')}</td>
      <td style="white-space:nowrap">${taskActions(t)}</td>
    </tr>`;
  }).join('');
}

function renderPager(total) {
  const pages = Math.max(1, Math.ceil(total / state.size));
  if (state.page > pages) state.page = pages;
  const nums = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - state.page) <= 2) {
      nums.push(i);
    } else if (nums[nums.length - 1] !== '…') {
      nums.push('…');
    }
  }
  $('pager').innerHTML = `
    <span class="info">共 ${total} 条 · 第 ${state.page}/${pages} 页</span>
    <select class="select" onchange="state.size=+this.value;state.page=1;loadTasks()">
      ${[10,20,50,100].map(s => `<option value="${s}" ${s===state.size?'selected':''}>每页 ${s}</option>`).join('')}
    </select>
    <div class="pages">
      <button class="btn" onclick="goPage(${state.page - 1})" ${state.page<=1?'disabled':''}>‹</button>
      ${nums.map(n => n === '…' ? '<span class="info">…</span>'
        : `<button class="btn ${n===state.page?'cur':''}" onclick="goPage(${n})">${n}</button>`).join('')}
      <button class="btn" onclick="goPage(${state.page + 1})" ${state.page>=pages?'disabled':''}>›</button>
    </div>`;
}
function goPage(p) {
  const pages = Math.ceil((parseInt($('pager').dataset.total || '0', 10) || 1) / state.size);
  if (p < 1 || p > pages) return;
  state.page = p;
  loadTasks();
}

async function loadTasks() {
  try {
    const data = await api(tasksUrl());
    $('pager').dataset.total = data.total;
    renderCards(data.counts || {});
    renderTasks(data.tasks || []);
    renderPager(data.total || 0);
    $('arr-' + state.sort).textContent = state.order === 'asc' ? ' ↑' : ' ↓';
    $('refreshed').textContent = '更新于 ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('rows').innerHTML = `<tr><td colspan="9" class="empty">加载失败: ${escapeHtml(e.message)}</td></tr>`;
  }
}

function renderPipelines(tasks) {
  const tbody = $('pipelineRows');
  if (!tasks.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无任务</td></tr>'; return; }
  const children = id => tasks.filter(t => t.parent_task_id === id);
  let html = '';
  for (const t of tasks) {
    if (t.parent_task_id) continue;
    const kids = children(t.task_id);
    const link = (t.source_table && t.target_table) ? `${escapeHtml(t.source_table)} → ${escapeHtml(t.target_table)}` : '—';
    const pipe = t.pipeline_id ? `<span class="tag">管道 ${t.pipeline_id}</span> ` : '';
    html += `<tr onclick="showDetail('${t.task_id}')">
      <td>${pipe}<b>${t.task_id}</b></td>
      <td><span class="tag ${t.status}">${statusText(t.status)}</span></td>
      <td>${link}</td><td>${fmtTime(t.created_at)}</td>
      <td>${fmtTime(t.completed_at) || '—'}</td>
      <td>${durationSec(t.created_at, t.completed_at)}</td>
      <td class="err-cell" title="${escapeHtml(t.error || '')}">${escapeHtml(t.error || '')}</td></tr>`;
    for (const k of kids) {
      const klink = (k.source_table && k.target_table) ? `${escapeHtml(k.source_table)} → ${escapeHtml(k.target_table)}` : '—';
      html += `<tr class="tree-child" onclick="showDetail('${k.task_id}')">
        <td>${k.task_id}</td>
        <td><span class="tag ${k.status}">${statusText(k.status)}</span></td>
        <td>${klink}</td><td>${fmtTime(k.created_at)}</td>
        <td>${fmtTime(k.completed_at) || '—'}</td>
        <td>${durationSec(k.created_at, k.completed_at)}</td>
        <td class="err-cell" title="${escapeHtml(k.error || '')}">${escapeHtml(k.error || '')}</td></tr>`;
    }
  }
  tbody.innerHTML = html;
}

async function loadPipelines() {
  try {
    const data = await api('/tasks/pipelines?limit=200');
    renderPipelines(data.tasks || []);
  } catch (e) { $('pipelineRows').innerHTML = `<tr><td colspan="7" class="empty">${escapeHtml(e.message)}</td></tr>`; }
}

async function loadSources() {
  const tbody = $('dsRows');
  tbody.innerHTML = '<tr><td colspan="7" class="empty">加载中…</td></tr>';
  try {
    const data = await api('/datasources');
    const srcs = data.sources || [];
    if (!srcs.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无数据源，点击右上角"新增数据源"</td></tr>'; return; }
    tbody.innerHTML = srcs.map(s => `<tr>
      <td><b>${escapeHtml(s.name)}</b></td>
      <td><span class="tag type">${DBTYPE_LABELS[s.db_type] || escapeHtml(s.db_type)}</span></td>
      <td>${escapeHtml(s.host)}:${s.port}</td>
      <td>${escapeHtml(s.database || '—')}</td>
      <td>${escapeHtml(s.remark || '—')}</td>
      <td>${s.has_password ? '●●●●' : '未设置'}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-action" onclick="testDs(${s.id})">测试</button>
        <button class="btn btn-action" onclick="openDsForm(${s.id})">编辑</button>
        <button class="btn btn-danger" onclick="deleteDs(${s.id})">删除</button>
      </td></tr>`).join('');
  } catch (e) { tbody.innerHTML = `<tr><td colspan="7" class="empty">${escapeHtml(e.message)}</td></tr>`; }
}

function openDsForm(id) {
  $('dsTestResult').textContent = '';
  $('dsTestResult').className = 'test-result';
  if (id) {
    api('/datasources').then(d => {
      const s = (d.sources || []).find(x => x.id === id);
      if (!s) return;
      $('dsTitle').textContent = '编辑数据源';
      $('dsId').value = s.id;
      $('dsName').value = s.name;
      $('dsType').value = s.db_type;
      $('dsHost').value = s.host;
      $('dsPort').value = s.port;
      $('dsUser').value = s.username || '';
      $('dsPass').value = '';
      $('dsDb').value = s.database || '';
      $('dsRemark').value = s.remark || '';
      $('dsModal').style.display = 'block';
    }).catch(e => alert(e.message));
  } else {
    $('dsTitle').textContent = '新增数据源';
    $('dsForm').reset();
    $('dsId').value = '';
    $('dsPort').value = '3306';
    $('dsModal').style.display = 'block';
  }
}
function closeDsModal() { $('dsModal').style.display = 'none'; }

function dsFields() {
  return {
    name: $('dsName').value.trim(), db_type: $('dsType').value,
    host: $('dsHost').value.trim(), port: parseInt($('dsPort').value || '0', 10),
    username: $('dsUser').value.trim(), password: $('dsPass').value,
    database: $('dsDb').value.trim(), remark: $('dsRemark').value.trim(),
  };
}
async function testDsFields() {
  const el = $('dsTestResult');
  el.className = 'test-result'; el.textContent = '测试中…';
  try {
    const r = await api('/datasources/test', {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, headers()), body: JSON.stringify(dsFields())});
    el.className = 'test-result ' + (r.success ? 'ok' : 'bad');
    el.textContent = r.success ? `✅ 连接成功 · ${r.latency_ms}ms` : `❌ ${r.error}`;
  } catch (e) { el.className = 'test-result bad'; el.textContent = '❌ ' + e.message; }
}
async function saveDs(e) {
  e.preventDefault();
  const id = $('dsId').value;
  const body = dsFields();
  try {
    const r = await api('/datasources' + (id ? '/' + id : ''), {
      method: id ? 'PUT' : 'POST',
      headers: Object.assign({'Content-Type':'application/json'}, headers()),
      body: JSON.stringify(body),
    });
    if (!r.success) { alert('保存失败: ' + r.error); return; }
    closeDsModal(); loadSources();
  } catch (err) { alert('保存失败: ' + err.message); }
}
async function testDs(id) {
  try {
    const r = await api('/datasources/' + id + '/test', {method:'POST'});
    alert(r.success ? `✅ 连接成功 · ${r.latency_ms}ms` : `❌ ${r.error}`);
  } catch (e) { alert(e.message); }
}
async function deleteDs(id) {
  if (!confirm('确认删除该数据源？')) return;
  try {
    const r = await api('/datasources/' + id, {method:'DELETE'});
    if (!r.success) { alert('删除失败: ' + r.error); return; }
    loadSources();
  } catch (e) { alert(e.message); }
}

function buildTimeline(logs, task) {
  const markers = [
    ['ConfigAgent 开始', '配置生成'], ['ConfigAgent 完成', '配置完成'],
    ['等待人工审批', '等待审批'], ['人工审批通过', '审批通过'],
    ['ExecutionAgent 开始', '执行同步'], ['ExecutionAgent 完成', '执行完成'],
    ['ValidationAgent 开始', '数据校验'], ['任务完成', '任务完成'],
  ];
  const stages = [];
  for (const l of logs) {
    for (const [kw, label] of markers) {
      if ((l.message || '').includes(kw)) { stages.push({label, time: l.created_at, msg: l.message.slice(0, 60)}); break; }
    }
  }
  if (!stages.length) return '<div class="empty">（无阶段日志）</div>';
  return '<div class="timeline">' + stages.map((s, i) => {
    const dur = i + 1 < stages.length ? durationSec(s.time, stages[i + 1].time) : durationSec(s.time, task.completed_at);
    return `<div class="tl-item"><span class="t">${fmtTime(s.time)}</span>${escapeHtml(s.label)}
      <span class="d">${dur}</span><div class="audit-detail">${escapeHtml(s.msg)}</div></div>`;
  }).join('') + '</div>';
}

function dbTypeLabel(t) {
  return {mysql:'MySQL', mongodb:'MongoDB', elasticsearch:'Elasticsearch', starrocks:'StarRocks'}[t] || t || '';
}

function syncRoute(t) {
  const pi = t.parsed_intent || {};
  const srcT = pi.source_table || t.source_table || '';
  const dstT = pi.target_table || t.target_table || '';
  if (!srcT && !dstT) return '';
  const src = [dbTypeLabel(pi.source_db_type), pi.source_database, srcT].filter(Boolean).join('.');
  const dst = [dbTypeLabel(pi.target_db_type), pi.target_database, dstT].filter(Boolean).join('.');
  return [src, dst].filter(Boolean).join(' → ');
}

function syncSection(task) {
  const pi = task.parsed_intent || {};
  if (!pi.source_db_type && !pi.target_db_type) return '';
  const srcHost = [pi.source_host, pi.source_port].filter(v => v != null && v !== '').join(':');
  const dstHost = [pi.target_host, pi.target_port].filter(v => v != null && v !== '').join(':');
  const srcName = pi.source_name || dbTypeLabel(pi.source_db_type) || '源端';
  const dstName = pi.target_name || dbTypeLabel(pi.target_db_type) || '目标端';
  const srcDetail = [
    dbTypeLabel(pi.source_db_type) || '',
    srcHost, [pi.source_database, pi.source_table].filter(Boolean).join('.'),
  ].filter(Boolean).join(' · ');
  const dstDetail = [
    dbTypeLabel(pi.target_db_type) || '',
    dstHost, [pi.target_database, pi.target_table].filter(Boolean).join('.'),
  ].filter(Boolean).join(' · ');
  return `
    <div class="section-title">同步链路</div>
    <div class="route-card">
      <div class="route-side">
        <div class="route-label">源端</div>
        <div class="route-name">${escapeHtml(srcName)}</div>
        <div class="route-detail">${escapeHtml(srcDetail) || '—'}</div>
      </div>
      <div class="route-arrow">→</div>
      <div class="route-side">
        <div class="route-label">目标端</div>
        <div class="route-name">${escapeHtml(dstName)}</div>
        <div class="route-detail">${escapeHtml(dstDetail) || '—'}</div>
      </div>
    </div>`;
}

function renderMapping(view) {
  const rows = (view.field_mapping || []).map(m => `
    <tr>
      <td class="src">${escapeHtml(m.source || '—')}${m.source_type ? `<span class="t">${escapeHtml(m.source_type)}</span>` : ''}</td>
      <td class="mid">──▶</td>
      <td class="dst">${escapeHtml(m.target || '—')}<span class="t">${escapeHtml(m.target_type || '—')}</span></td>
    </tr>`).join('');
  const wildcardHint = view.source_wildcard && !(view.source_schema || []).length;
  return `<table class="mapping-table">${rows}</table>
    ${wildcardHint ? `<div class="muted-flag" style="margin-top:8px">⚠ 源端为全列通配（*），已按位置与目标列对齐；需要精确映射请在 DataX JSON 中指定源列</div>` : ''}`;
}

const TYPE_OPTIONS = {
  elasticsearchwriter: ['long','keyword','text','date','integer','boolean','double','float'],
  mysqlwriter: ['bigint','int','varchar(50)','char(10)','date','datetime','decimal(10,2)','double','tinyint'],
  mongodbwriter: ['string','long','double','date','boolean','object'],
};

function mapRowHtml(m, srcCols, typeOpts) {
  const curSrc = m.source || '*';
  const srcOpts = ['*', ...srcCols].map(s =>
    `<option value="${escapeHtml(s)}" ${s === curSrc ? 'selected' : ''}>${escapeHtml(s === '*' ? '*（源全列）' : s)}</option>`).join('');
  return `<tr>
    <td><select class="select" data-map-src>${srcOpts}</select></td>
    <td class="mid">──▶</td>
    <td><input class="input" data-map-target value="${escapeHtml(m.target || '')}" placeholder="目标列名" style="width:100%"></td>
    <td><input class="input" data-map-type list="mapTypeList" value="${escapeHtml(m.target_type || '')}" placeholder="类型" style="width:100%"></td>
    <td style="text-align:right"><button class="btn btn-ghost" onclick="delMapRow(this)">✕</button></td>
  </tr>`;
}

function renderMappingEditor(view, cfg) {
  const writerName = (((cfg.datax_config || {}).job || {}).content || [{}])[0]?.writer?.name || '';
  const typeOpts = TYPE_OPTIONS[writerName] || ['string'];
  const srcCols = (view.source_schema || []).map(c => c.name);
  const rows = (view.field_mapping || []).map(m => mapRowHtml(m, srcCols, typeOpts)).join('');
  return `<table class="mapping-table">
    <thead><tr><th style="text-align:left">源列</th><th style="width:56px"></th>
      <th style="text-align:left">目标列</th><th style="text-align:left">类型</th><th style="width:44px"></th></tr></thead>
    <tbody id="mapRows">${rows || mapRowHtml({source:'*', target:'', target_type:''}, srcCols, typeOpts)}</tbody>
  </table>
  <datalist id="mapTypeList">${typeOpts.map(t => `<option value="${escapeHtml(t)}">`).join('')}</datalist>
  <div class="cfg-actions">
    <button class="btn btn-ghost" onclick="addMapRow()">+ 添加字段</button>
    <button class="btn btn-action" onclick="saveMapping()">保存字段映射</button>
  </div>`;
}

function addMapRow() {
  const tbody = $('mapRows');
  const first = tbody.querySelector('[data-map-src]');
  const srcs = first ? [...first.options].map(o => o.value) : ['*'];
  tbody.insertAdjacentHTML('beforeend', mapRowHtml({source: srcs[0] || '*', target: '', target_type: ''}, srcs, []));
}

function delMapRow(btn) {
  const rows = $('mapRows');
  if (rows.children.length <= 1) { alert('至少保留一个字段'); return; }
  btn.closest('tr').remove();
}

function collectMapping() {
  return [...document.querySelectorAll('#mapRows tr')].map(r => ({
    source: r.querySelector('[data-map-src]').value,
    target: r.querySelector('[data-map-target]').value.trim(),
    target_type: r.querySelector('[data-map-type]').value.trim(),
  })).filter(m => m.target);
}

async function saveMapping() {
  const mapping = collectMapping();
  if (!mapping.length) { alert('至少保留一个目标列'); return; }
  try {
    await api('/tasks/' + _detailTaskId + '/config/mapping', {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, headers()), body: JSON.stringify({mapping})});
    alert('字段映射已保存，审批时将使用新配置');
    showDetail(_detailTaskId);
  } catch (e) { alert('保存失败: ' + e.message); }
}

function renderConfigSection(cfg) {
  const view = cfg.view || {};
  const tabs = [];
  if ((view.field_mapping || []).length) tabs.push(['mapping', '字段映射']);
  if (view.where) tabs.push(['where', '增量条件']);
  if (cfg.datax_config) tabs.push(['json', 'DataX JSON']);
  if (cfg.etl_sql) tabs.push(['sql', 'ETL SQL']);
  if (!tabs.length) return '';

  const tabBtns = tabs.map(([key, label], i) =>
    `<button class="${i === 0 ? 'active' : ''}" data-cfg="${key}" onclick="switchCfgTab(this)">${label}</button>`).join('');
  const panes = [];
  if (tabs.some(t => t[0] === 'mapping')) {
    const mappingHtml = cfg.editable ? renderMappingEditor(view, cfg) : renderMapping(view);
    panes.push(`<div class="cfg-pane ${tabs[0][0] === 'mapping' ? 'active' : ''}" id="cfg-mapping">${mappingHtml}</div>`);
  }
  if (tabs.some(t => t[0] === 'where')) {
    panes.push(`<div class="cfg-pane ${tabs[0][0] === 'where' ? 'active' : ''}" id="cfg-where">
      <div class="where-box">${escapeHtml(view.where)}</div>
      <div class="muted-flag" style="margin-top:6px">增量同步按此条件过滤源端数据</div></div>`);
  }
  if (tabs.some(t => t[0] === 'json')) {
    const editable = cfg.editable;
    panes.push(`<div class="cfg-pane ${tabs[0][0] === 'json' ? 'active' : ''}" id="cfg-json">
      ${editable
        ? `<textarea class="cfg-edit" id="cfgEditJson" spellcheck="false">${escapeHtml(JSON.stringify(cfg.datax_config, null, 2))}</textarea>
           <div class="cfg-actions"><button class="btn btn-action" onclick="saveConfig()">保存配置</button></div>`
        : `<pre class="audit-detail" style="white-space:pre-wrap">${escapeHtml(JSON.stringify(cfg.datax_config, null, 2))}</pre>`}
    </div>`);
  }
  if (tabs.some(t => t[0] === 'sql')) {
    const editable = cfg.editable;
    panes.push(`<div class="cfg-pane ${tabs[0][0] === 'sql' ? 'active' : ''}" id="cfg-sql">
      ${editable
        ? `<textarea class="cfg-edit" id="cfgEditSql" spellcheck="false">${escapeHtml(cfg.etl_sql || '')}</textarea>
           <div class="cfg-actions"><button class="btn btn-action" onclick="saveConfigSql()">保存 ETL SQL</button></div>`
        : `<pre class="audit-detail" style="white-space:pre-wrap">${escapeHtml(cfg.etl_sql || '')}</pre>`}
    </div>`);
  }
  return `
    <div class="section-title">同步配置${cfg.editable ? ' <span class="tag" style="background:rgba(234,179,8,.15);color:var(--warn)">可编辑</span>' : ''}</div>
    <div class="cfg-tabs">${tabBtns}</div>
    ${panes.join('')}`;
}

function switchCfgTab(btn) {
  document.querySelectorAll('.cfg-tabs button').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
  const key = btn.dataset.cfg;
  document.querySelectorAll('.cfg-pane').forEach(x => x.classList.remove('active'));
  const pane = $('cfg-' + key);
  if (pane) pane.classList.add('active');
}

let _detailTaskId = '';

async function saveConfig() {
  const taskId = _detailTaskId;
  try {
    const parsed = JSON.parse($('cfgEditJson').value);
    await api('/tasks/' + taskId + '/config', {method:'PUT', headers:Object.assign({'Content-Type':'application/json'}, headers()), body: JSON.stringify({datax_config: parsed})});
    alert('配置已保存，审批时将使用最新配置');
    showDetail(taskId);
  } catch (e) { alert('保存失败: ' + e.message); }
}

async function saveConfigSql() {
  const taskId = _detailTaskId;
  try {
    await api('/tasks/' + taskId + '/config', {method:'PUT', headers:Object.assign({'Content-Type':'application/json'}, headers()), body: JSON.stringify({etl_sql: $('cfgEditSql').value})});
    alert('ETL SQL 已保存，审批时将使用最新配置');
    showDetail(taskId);
  } catch (e) { alert('保存失败: ' + e.message); }
}

async function showDetail(taskId) {
  try {
    const [task, logs, audit, cfg] = await Promise.all([
      api('/tasks/' + taskId), api('/tasks/' + taskId + '/logs'),
      api('/audit?task_id=' + taskId), api('/tasks/' + taskId + '/config'),
    ]);
    _detailTaskId = taskId;
    $('detailTitle').textContent = '任务 ' + taskId + ' 详情';
    const tl = buildTimeline(logs.logs || [], task);
    const audits = (audit.logs || []).map(l =>
      `<div class="tl-item"><span class="t">${fmtTime(l.created_at)}</span>${escapeHtml(l.action)}
       <span class="d">${escapeHtml(l.operator)}</span><div class="audit-detail">${escapeHtml(l.detail || '')}</div></div>`).join('');
    const type = TYPE_LABELS[task.task_type] || escapeHtml(task.task_type || '—');
    const diag = task.ops_diagnosis ? `
      <div class="section-title">运维诊断</div>
      <div>根因：<b>${escapeHtml(task.ops_diagnosis.root_cause || '')}</b></div>
      <div style="margin-top:4px">影响：${escapeHtml(task.ops_diagnosis.impact || '')}</div>
      <div>置信度：${task.ops_diagnosis.confidence ?? ''}（来源：${escapeHtml(task.ops_diagnosis.source || '')}）</div>
      <div style="margin-top:4px">处置步骤：<ol>${(task.ops_diagnosis.solution_steps || []).map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol></div>
      ${(task.ops_diagnosis.related_links || []).length ? `<div>参考链接：${task.ops_diagnosis.related_links.map(l =>
        `<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.title || l.url)}</a>`).join(' · ')}</div>` : ''}` : '';
    const opsAct = task.ops_actions ? `
      <div class="section-title">处置动作</div>
      ${task.ops_actions.health ? `<div>组件健康：${task.ops_actions.health.healthy ? '✅' : '❌'} ${
        Object.entries(task.ops_actions.health.results || {}).map(([k, v]) => `${k}:${v.ok ? '✅' : '❌'}`).join(' ')}</div>` : ''}
      ${(task.ops_actions.actions || []).map(a =>
        `<div>· ${escapeHtml(a.action)}：${escapeHtml(JSON.stringify(a.result || {}).slice(0, 300))}</div>`).join('')}
    ` : '';
    const opsRec = task.ops_record_result ? `
      <div class="section-title">事故沉淀</div><div>${escapeHtml(task.ops_record_result.summary || '')}</div>` : '';
    const anal = task.analysis_result ? `
      <div class="section-title">分析结果</div>
      ${task.analysis_summary ? `<div style="margin-bottom:6px">${escapeHtml(task.analysis_summary)}</div>` : ''}
      <table style="width:100%;font-size:12.5px;border-collapse:collapse"><thead><tr>
        ${(task.analysis_result.columns || []).map(c => `<th style="text-align:left;border-bottom:1px solid var(--border);padding:4px">${escapeHtml(c)}</th>`).join('')}
      </tr></thead><tbody>
        ${(task.analysis_result.rows || []).slice(0, 50).map(r =>
          `<tr>${(task.analysis_result.columns || []).map(c =>
            `<td style="padding:3px 6px;border-bottom:1px solid var(--border)">${escapeHtml(r[c])}</td>`).join('')}</tr>`).join('')}
      </tbody></table>
      ${task.analysis_sql ? `<div class="audit-detail" style="margin-top:6px">${escapeHtml(task.analysis_sql)}</div>` : ''}` : '';
    const etl = task.etl_sql ? `
      <div class="section-title">ETL 透传</div>
      <div>源：${escapeHtml(task.etl_source_table || '')} → 目标：${escapeHtml(task.etl_target_table || '')}
           <span class="d">（${escapeHtml(task.etl_partition_date || '')}）</span></div>
      ${task.validation_result ? `<div style="margin-top:4px">校验：${escapeHtml(task.validation_result.summary || '')}</div>` : ''}
      <pre class="audit-detail" style="white-space:pre-wrap">${escapeHtml(task.etl_sql)}</pre>` : '';
    $('detailBody').innerHTML = `
      <div class="detail-overview">
        <div class="detail-query">${escapeHtml(task.user_query)}</div>
        ${syncSection(task)}
      </div>
      <div class="detail-meta">
        <span>类型：<span class="tag type">${type}</span></span>
        <span>状态：<span class="tag ${task.status}">${statusText(task.status)}</span></span>
        <span>创建：${fmtTime(task.created_at)}</span>
        <span>完成：${fmtTime(task.completed_at) || '—'}</span>
        <span>耗时：${durationSec(task.created_at, task.completed_at)}</span>
      </div>
      ${renderConfigSection(cfg)}
      <div class="section-title">阶段时间线</div>${tl}
      ${diag}${opsAct}${opsRec}${anal}${etl}
      <div class="section-title">审计记录</div>${audits || '<div class="empty">（无审计）</div>'}
      <div class="section-title">错误信息</div><pre>${escapeHtml(task.error || '（无）')}</pre>
      <div class="audit-detail">AI 链路追踪见 LangSmith 项目 dataagent（task_id=${taskId} 对应 thread_id）</div>`;
    $('detailActions').innerHTML = taskActions(task, false);
    $('modal').style.display = 'block';
  } catch (e) { alert('加载详情失败: ' + e.message); }
}
function closeModal() { $('modal').style.display = 'none'; }

async function doApprove(id) { if (!confirm('确认执行该任务？')) return;
  try { const r = await api('/tasks/' + id + '/approve', {method:'POST'}); alert('已通过并执行: ' + (r.status || '')); } catch(e) { alert(e.message); } loadAll(); }
async function doReject(id) { if (!confirm('确认拒绝执行该任务？')) return;
  try { await api('/tasks/' + id + '/reject', {method:'POST'}); alert('已拒绝执行'); } catch(e) { alert(e.message); } loadAll(); }
async function doRetry(id) { if (!confirm('确认重试该任务？')) return;
  try { const r = await api('/tasks/' + id + '/retry', {method:'POST'}); alert('已提交重试: ' + r.task_id); } catch(e) { alert(e.message); } loadAll(); }
async function doDiagnose(id) {
  alert('运维诊断执行中（约 1-3 分钟），完成后自动打开诊断详情');
  try {
    const r = await api('/ops/diagnose', {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, headers()), body: JSON.stringify({task_id: id})});
    loadAll();
    if (r && r.task_id) showDetail(r.task_id);
  } catch(e) { alert(e.message); }
}

// ---------- 筛选/排序/分页 ----------
function toggleSort(col) {
  if (state.sort === col) { state.order = state.order === 'asc' ? 'desc' : 'asc'; }
  else { state.sort = col; state.order = 'desc'; }
  state.page = 1;
  loadTasks();
}
function clearFilters() {
  state.status = 'all'; state.type = 'all'; state.q = ''; state.time = 'all'; state.page = 1;
  $('filterStatus').value = 'all'; $('filterType').value = 'all'; $('filterTime').value = 'all'; $('search').value = '';
  loadTasks();
}
let searchTimer = null;
$('search').oninput = e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.q = e.target.value.trim(); state.page = 1; loadTasks(); }, 300); };
$('filterStatus').onchange = e => { state.status = e.target.value; state.page = 1; loadTasks(); };
$('filterType').onchange = e => { state.type = e.target.value; state.page = 1; loadTasks(); };
$('filterTime').onchange = e => { state.time = e.target.value; state.page = 1; loadTasks(); };

document.querySelectorAll('.sidebar nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.sidebar nav button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.tab = b.dataset.tab;
  ['tasks','pipelines','audit','health','datasources'].forEach(t => $('tab-' + t).style.display = t === b.dataset.tab ? '' : 'none');
  if (b.dataset.tab === 'tasks') loadTasks();
  if (b.dataset.tab === 'pipelines') loadPipelines();
  if (b.dataset.tab === 'audit') loadAudit();
  if (b.dataset.tab === 'health') loadHealth();
  if (b.dataset.tab === 'datasources') loadSources();
});

function loadAll() {
  loadTasks();
  if (state.tab === 'pipelines') loadPipelines();
  if (state.tab === 'audit') loadAudit();
  if (state.tab === 'health') loadHealth();
  if (state.tab === 'datasources') loadSources();
}

$('apiToken').value = localStorage.getItem(TOKEN_KEY) || '';
$('apiToken').onchange = e => localStorage.setItem(TOKEN_KEY, e.target.value);
$('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };
$('dsModal').onclick = e => { if (e.target === $('dsModal')) closeDsModal(); };
initTheme();
loadAll();
setInterval(() => {
  if (state.tab === 'tasks') loadTasks();
  if (state.tab === 'pipelines') loadPipelines();
}, 10000);
</script>
</body>
