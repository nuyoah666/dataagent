<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗄️</text></svg>">
<title>数仓多 Agent 协作平台 · 交互</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8;
          --ok:#22c55e; --err:#ef4444; --run:#f59e0b; --accent:#38bdf8; }
  :root[data-theme="light"] { --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0; --text:#0f172a;
          --muted:#64748b; --ok:#16a34a; --err:#dc2626; --run:#d97706; --accent:#0284c7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; }
  header h1 { font-size:17px; }
  header .links { margin-left:auto; display:flex; gap:14px; }
  header a { color:var(--accent); text-decoration:none; font-size:13px; }
  .theme-btn { background:none; border:1px solid var(--border); color:var(--muted); border-radius:7px;
               padding:4px 10px; cursor:pointer; font-size:13px; }
  .theme-btn:hover { color:var(--accent); border-color:var(--accent); }
  header .token-box { display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted); }
  header input { background:var(--card); border:1px solid var(--border); color:var(--text);
                 border-radius:6px; padding:4px 8px; width:160px; }
  .layout { flex:1; display:flex; min-height:0; }
  .history { width:250px; flex-shrink:0; background:var(--card); border-right:1px solid var(--border);
             display:flex; flex-direction:column; min-height:0; }
  .history-head { padding:12px 14px; font-size:13px; font-weight:600; border-bottom:1px solid var(--border);
                  display:flex; align-items:center; justify-content:space-between; }
  .history-refresh { background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; }
  .history-refresh:hover { color:var(--accent); }
  .history-list { flex:1; overflow-y:auto; padding:8px; }
  .history-item { padding:8px 10px; border-radius:8px; cursor:pointer; font-size:12.5px;
                  border:1px solid var(--border); margin-bottom:6px; background:rgba(148,163,184,.05); }
  .history-item:hover { border-color:var(--accent); }
  .history-item .q { color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .history-item .meta { font-size:11px; color:var(--muted); margin-top:4px; display:flex; gap:6px; align-items:center; }
  .history-item .meta .id { overflow:hidden; text-overflow:ellipsis; }
  .history-empty { padding:14px; font-size:12px; color:var(--muted); }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #conv { flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:760px; width:fit-content; border-radius:12px; padding:10px 14px; font-size:13.5px; line-height:1.6; }
  .msg.user { align-self:flex-end; background:rgba(56,189,248,.15); border:1px solid rgba(56,189,248,.3); }
  .msg.assistant { align-self:flex-start; background:var(--card); border:1px solid var(--border); min-width:320px; }
  .msg .meta { font-size:11.5px; color:var(--muted); margin-bottom:6px; }
  .tag { padding:2px 10px; border-radius:999px; font-size:11.5px; }
  .tag.success { background:rgba(34,197,94,.15); color:var(--ok); }
  .tag.failed { background:rgba(239,68,68,.15); color:var(--err); }
  .tag.pending_approval { background:rgba(234,179,8,.15); color:#eab308; }
  .tag.running,.tag.executing,.tag.validating,.tag.config_done,.tag.exec_done { background:rgba(245,158,11,.15); color:var(--run); }
  .tag.cancelled { background:rgba(148,163,184,.15); color:var(--muted); }
  .stage { font-size:12px; color:var(--muted); margin-top:6px; }
  .stage .done { color:var(--ok); }
  .stage .cur { color:var(--run); font-weight:600; }
  .stage .line { padding:1px 0; }
  .btns { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn { padding:5px 14px; border:none; border-radius:7px; cursor:pointer; font-size:12.5px; }
  .btn-approve { background:rgba(34,197,94,.2); color:var(--ok); }
  .btn-reject { background:rgba(239,68,68,.2); color:var(--err); }
  .btn-action { background:rgba(56,189,248,.15); color:var(--accent); }
  .error { color:var(--err); font-size:12.5px; margin-top:6px; white-space:pre-wrap; }
  .ok-text { color:var(--ok); font-size:12.5px; margin-top:6px; white-space:pre-wrap; }
  .sql-block { margin-top:8px; background:rgba(148,163,184,.08); border:1px solid var(--border);
               border-radius:8px; padding:8px 10px; }
  .sql-block .sql-label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
  .caliber-block { margin-top:8px; background:rgba(34,197,94,.08); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; white-space:pre-wrap; font-size:12px; color:var(--text); }
  .caliber-block .sql-label { color:var(--ok,#22c55e); }
  .decisions { margin-top:8px; border:1px solid var(--border); border-radius:8px; }
  .decisions summary { cursor:pointer; padding:7px 10px; font-size:12.5px; color:var(--muted); list-style:none; }
  .decisions summary::-webkit-details-marker{ display:none; }
  .decisions[open] summary { border-bottom:1px solid var(--border); }
  .dec-list { padding:6px 10px; }
  .dec-item { display:flex; gap:8px; align-items:flex-start; font-size:12px; padding:3px 0; }
  .dec-time { color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .basis-badge { flex:none; padding:0 7px; border-radius:999px; font-size:11px; line-height:18px; }
  .basis-rule{background:rgba(37,99,235,.15);color:var(--accent);}
  .basis-llm{background:rgba(168,85,247,.18);color:#a855f7;}
  .basis-default{background:rgba(217,119,6,.16);color:#d97706;}
  .basis-explicit{background:rgba(22,163,74,.16);color:var(--ok,#16a34a);}
  .basis-human{background:rgba(100,116,139,.18);color:var(--muted);}
  .dec-node{color:var(--muted); flex:none; min-width:64px;}
  .dec-text{word-break:break-word;}
  .dec-conf{color:var(--muted); font-size:11px;}
  .sql-block code { font-family:Consolas,monospace; font-size:12px; color:var(--accent);
                    white-space:pre-wrap; word-break:break-all; }
  .result-wrap { margin-top:8px; overflow-x:auto; }
  .result-table { border-collapse:collapse; font-size:12.5px; width:100%; }
  .result-table th, .result-table td { border:1px solid var(--border); padding:4px 10px;
                                       text-align:left; white-space:nowrap; }
  .result-table th { background:rgba(148,163,184,.12); color:var(--muted); font-weight:600; }
  .result-meta { font-size:11px; color:var(--muted); margin-top:4px; }
  footer { border-top:1px solid var(--border); padding:12px 22px; }
  .chips { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .chip { font-size:12px; color:var(--muted); background:var(--card); border:1px solid var(--border);
          border-radius:999px; padding:4px 12px; cursor:pointer; }
  .chip:hover { color:var(--accent); border-color:var(--accent); }
  .input-row { display:flex; gap:10px; }
  .input-row input { flex:1; background:var(--card); border:1px solid var(--border); color:var(--text);
                     border-radius:10px; padding:12px 16px; font-size:14px; }
  .input-row button { background:var(--accent); color:#0b1220; border:none; border-radius:10px;
                      padding:0 22px; font-size:14px; font-weight:600; cursor:pointer; }
  :root[data-theme="light"] .input-row button { color:#fff; }
  .input-row button:disabled { opacity:.5; cursor:not-allowed; }
  .spinner { display:inline-block; width:12px; height:12px; border:2px solid var(--border);
             border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-1px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <header>
    <h1>数仓多 Agent 协作平台</h1>
    <span class="token-box">操作人 <input id="operatorName" value="local-user" style="width:110px"></span>
    <span class="token-box">Token <input type="password" id="apiToken" placeholder="API_TOKEN（可选）"></span>
    <span class="links">
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">☀️</button>
      <a href="/ui/wizard" target="_blank">同步向导 ↗</a>
      <a href="/ui/semantic" target="_blank">语义层/提示词 ↗</a>
      <a href="/ui" target="_blank">全链路监控 ↗</a>
    </span>
  </header>

  <div class="layout">
    <aside class="history">
      <div class="history-head">历史任务
        <button class="history-refresh" onclick="loadHistory()">⟳</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </aside>
    <main class="main">
      <div id="conv"></div>
      <footer>
    <div class="chips" id="chips"></div>
    <div class="input-row">
      <input id="query" placeholder="输入自然语言指令，例如：把 MySQL 的 src_user 表同步到 ES 的 src_user_index"
             autocomplete="off" onkeydown="if(event.key==='Enter') send()">
      <button id="sendBtn" onclick="send()">发送</button>
        </div>
      </footer>
    </main>
  </div>

<script src="/static/common.js"></script>
<script>
const pollers = new Set();
let submitting = false;
const EXAMPLES = [
  '把 MySQL 的 src_user 表同步到 ES 的 src_user_index',
  '把 ods_user 加工到 dwd_user',
  '把 MySQL 的 src_user 表增量同步到 ES',
  '诊断最近失败的任务',
  '分析用户数按日期',
];


const TERMINAL = ['success', 'failed', 'cancelled'];
const STAGE_LABEL = {
  submitted:'已提交', pending:'排队中', running:'处理中', config_done:'配置完成',
  pending_approval:'待审批', executing:'执行中', exec_done:'执行完成',
  validating:'校验中', success:'成功', failed:'失败', cancelled:'已取消',
  approved:'审批通过', config:'配置生成', done:'完成',
};

async function loadHistory() {
  try {
    const data = await api('/tasks?limit=30');
    const tasks = data.tasks || [];
    $('historyList').innerHTML = tasks.map(t => `
      <div class="history-item" onclick="openHistory('${t.task_id}')">
        <div class="q">${escapeHtml(t.user_query || '（无查询）')}</div>
        <div class="meta"><span class="tag ${t.status}">${STAGE_LABEL[t.status] || t.status}</span><span class="id">${escapeHtml(t.task_id)}</span></div>
      </div>`).join('') || '<div class="history-empty">暂无历史任务</div>';
  } catch (e) { $('historyList').innerHTML = '<div class="history-empty">加载失败</div>'; }
}

async function openHistory(taskId) {
  $('conv').innerHTML = '';
  try {
    const [t, logs] = await Promise.all([
      api('/tasks/' + taskId), api('/tasks/' + taskId + '/logs'),
    ]);
    const card = addMsg(`
      <div class="meta">任务 ${t.task_id} · 识别为 <b>${escapeHtml(t.task_type || '—')}</b></div>
      <div class="history-q" style="margin-bottom:8px;color:var(--text)">${escapeHtml(t.user_query || '')}</div>
      <div id="card-${t.task_id}">${renderTask(t, logs.logs || [])}</div>`, 'assistant');
    // 非终态都启动轮询（含待审批）：外部页面审批/拒绝后卡片自动更新
    if (!TERMINAL.includes(t.status)) {
      pollTask(t.task_id, card);
    }
  } catch (e) { addMsg('❌ ' + escapeHtml(e.message), 'assistant'); }
}

function addMsg(html, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = html;
  $('conv').appendChild(div);
  $('conv').scrollTop = $('conv').scrollHeight;
  return div;
}

async function send() {
  if (submitting) return;
  const query = $('query').value.trim();
  if (!query) return;
  submitting = true;
  $('query').value = '';
  $('sendBtn').disabled = true;
  addMsg(escapeHtml(query).replace(/\n/g,'<br>'), 'user');
  try {
    const r = await api('/chat/submit', {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, headers()), body: JSON.stringify({query})});
    const card = addMsg(`
      <div class="meta">任务 ${r.task_id} · 识别为 <b>${escapeHtml(r.task_type)}</b></div>
      <div id="card-${r.task_id}"><span class="spinner"></span> 处理中…</div>`, 'assistant');
    pollTask(r.task_id, card);
    loadHistory();
  } catch (e) {
    addMsg('❌ ' + escapeHtml(e.message), 'assistant');
  } finally {
    submitting = false;
    $('sendBtn').disabled = false;
  }
}

async function pollTask(taskId, card) {
  if (pollers.has(taskId)) return;
  pollers.add(taskId);
  try {
  const box = () => $('card-' + taskId);
  while (box()) {
    try {
      const [t, logs] = await Promise.all([
        api('/tasks/' + taskId),
        api('/tasks/' + taskId + '/logs'),
      ]);
      box().innerHTML = renderTask(t, logs.logs || []);
      // 仅终态停止轮询；待审批/执行中继续轮询，
      // 这样即使在别的页面（全链路监控）审批，chat 卡片也会自动更新到最新状态
      if (TERMINAL.includes(t.status)) return;
    } catch (e) { /* 轮询失败继续 */ }
    await sleep(2000);
  }
  } finally { pollers.delete(taskId); }
}

function renderAnalysis(t) {
  // 问数任务：SQL 一生成就展示（执行中可见），结果/总结到位后追加
  if (!t.analysis_sql && !t.analysis_result) return '';
  let html = '';
  if (t.analysis_caliber && t.analysis_caliber.text) {
    html += `<div class="caliber-block"><span class="sql-label">📐 口径说明（与实际执行同源，LLM 不参与编造）</span>` +
            escapeHtml(t.analysis_caliber.text) + `</div>`;
  }
  if (t.analysis_sql) {
    html += `<div class="sql-block"><span class="sql-label">📊 语义层生成 SQL（只读）</span>` +
            `<code>${escapeHtml(t.analysis_sql)}</code></div>`;
  }
  const r = t.analysis_result;
  if (r && r.columns && r.rows && r.rows.length) {
    const cols = r.columns;
    html += `<div class="result-wrap"><table class="result-table"><thead><tr>` +
      cols.map(c => `<th>${escapeHtml(c)}</th>`).join('') + `</tr></thead><tbody>` +
      r.rows.map(row => `<tr>${cols.map(c => `<td>${escapeHtml(row[c] == null ? '' : row[c])}</td>`).join('')}</tr>`).join('') +
      `</tbody></table><div class="result-meta">共 ${r.row_count || r.rows.length} 行</div></div>`;
  }
  if (t.analysis_summary) {
    html += `<div class="ok-text">🤖 ${escapeHtml(t.analysis_summary)}</div>`;
  }
  return html;
}

const BASIS_LABEL = {explicit:"显式指令", rule:"规则", llm:"LLM", default:"默认/回填", human:"人工"};
const NODE_LABEL = {
  route:"意图路由", context:"上下文指代", intent_parse:"意图解析", credential:"凭据来源",
  analysis_parse:"问数解析", analysis_backfill:"规则兜底", semantic_pick:"语义选表",
  ops_diagnose:"运维诊断", ops_auto_fix:"运维自动修复", validation:"校验结论",
  task_approve:"审批", task_reject:"拒绝", config_edit:"改配置", mapping_edit:"改映射",
  target_table_create:"建表", badcase_reap:"沉淀BadCase", goodcase_reap:"沉淀GoodCase",
};
function renderDecisions(t) {
  const ds = t.decisions;
  if (!ds || !ds.length) return '';
  const rows = ds.map(d => {
    const basis = d.basis || 'rule';
    const time = (d.created_at || '').slice(11, 19);
    const node = NODE_LABEL[d.node] || d.node;
    const conf = (d.confidence != null) ? ` <span class="dec-conf">·置信${d.confidence}</span>` : '';
    const who = d.operator ? ` <span class="dec-conf">·${escapeHtml(d.operator)}</span>` : '';
    return `<div class="dec-item">
      <span class="dec-time">${escapeHtml(time)}</span>
      <span class="basis-badge basis-${basis}">${BASIS_LABEL[basis] || basis}</span>
      <span class="dec-node">${escapeHtml(node)}</span>
      <span class="dec-text">${escapeHtml(d.decision || '')}${conf}${who}</span>
    </div>`;
  }).join('');
  return `<details class="decisions"><summary>🧭 决策依据（${ds.length}）：每步凭什么这么决定</summary>
    <div class="dec-list">${rows}</div></details>`;
}

function renderTask(t, logs) {
  const stages = [];
  const markers = [
    ['已提交', 'submitted'], ['ConfigAgent 开始', 'config'], ['ConfigAgent 完成', 'config_done'],
    ['等待人工审批', 'pending_approval'], ['人工审批通过', 'approved'],
    ['ExecutionAgent 开始', 'executing'], ['ExecutionAgent 完成', 'exec_done'],
    ['ValidationAgent 开始', 'validating'], ['任务完成', 'done'],
  ];
  for (const l of logs) {
    for (const [kw, key] of markers) {
      if ((l.message || '').includes(kw)) { stages.push(key); break; }
    }
  }
  const cur = t.status;
  const order = ['submitted','pending','running','config_done','pending_approval','approved','executing','exec_done','validating','done'];
  const stageHtml = order.filter(s => stages.includes(s) || s === cur).map(s => {
    const isCur = s === cur;
    return `<div class="line ${isCur ? 'cur' : 'done'}">${isCur ? '◉' : '✓'} ${STAGE_LABEL[s] || s}</div>`;
  }).join('');

  let body = `<span class="tag ${t.status}">${STAGE_LABEL[t.status] || t.status}</span>`;
  if (t.status === 'pending_approval') {
    body += `<div class="btns">
      <button class="btn btn-approve" onclick="act('${t.task_id}','approve')">✅ 通过并执行</button>
      <button class="btn btn-reject" onclick="act('${t.task_id}','reject')">❌ 拒绝</button>
      <a class="btn btn-action" style="text-decoration:none" href="/ui" target="_blank">查看配置</a>
    </div>`;
  }
  if (t.status === 'failed') {
    body += `<div class="error">${escapeHtml(t.error || '执行失败')}</div>
      <div class="btns">
        <button class="btn btn-action" onclick="act('${t.task_id}','retry')">重试</button>
        <button class="btn btn-action" onclick="diagnose('${t.task_id}')">运维诊断</button>
      </div>`;
  }
  if (t.status === 'success') {
    const v = t.validation_result || {};
    body += `<div class="ok-text">✅ ${escapeHtml(v.summary || '任务成功')}</div>`;
  }
  body += renderAnalysis(t);
  body += renderDecisions(t);
  if (t.status === 'cancelled') body += `<div class="error">任务已取消</div>`;
  if (!TERMINAL.includes(t.status) && t.status !== 'pending_approval') {
    body = `<span class="spinner"></span> 处理中…<div class="stage">${stageHtml}</div>` + body;
  } else if (stageHtml) {
    body += `<div class="stage">${stageHtml}</div>`;
  }
  return body;
}

async function act(taskId, action) {
  if (!confirm('确认' + ({approve:'通过执行', reject:'拒绝', retry:'重试'}[action]) + '该任务？')) return;
  const box = $('card-' + taskId);
  if (box) box.innerHTML = '<span class="spinner"></span> 处理中…';
  try {
    const r = await api('/tasks/' + taskId + '/' + action, {method:'POST'});
    if (action === 'retry' && r.task_id) {
      const card = addMsg(`
        <div class="meta">重试任务 ${r.task_id} · 已提交</div>
        <div id="card-${r.task_id}"><span class="spinner"></span> 处理中…</div>`, 'assistant');
      pollTask(r.task_id, card);
    } else {
      pollTask(taskId);  // 审批/拒绝后恢复轮询，展示执行或最终状态
    }
  } catch (e) { alert(e.message); }
}

async function diagnose(taskId) {
  const card = addMsg('<div class="meta">运维诊断中（约 1-3 分钟）</div><span class="spinner"></span> 正在检索事故知识库并生成诊断…', 'assistant');
  try {
    const r = await api('/ops/diagnose', {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, headers()), body: JSON.stringify({task_id: taskId})});
    card.innerHTML = `<div class="meta">运维诊断完成</div>
      <div style="color:var(--muted);font-size:12px;margin-bottom:4px">诊断对象：<span style="font-family:monospace">${escapeHtml(r.diagnose_task_id || taskId)}</span>（运维任务 <span style="font-family:monospace">${escapeHtml(r.task_id || '—')}</span>）</div>
      <b>根因：</b>${escapeHtml((r.diagnosis||{}).root_cause || '—')}<br>
      <b>处置建议：</b>${escapeHtml(((r.diagnosis||{}).solution_steps||[]).join('；') || '—')}<br>
      <b>事故沉淀：</b>${escapeHtml((r.record||{}).summary || '—')}`;
  } catch (e) { alert('诊断失败: ' + e.message); }
}

$('apiToken').value = localStorage.getItem(TOKEN_KEY) || '';
$('apiToken').onchange = e => localStorage.setItem(TOKEN_KEY, e.target.value);
$('operatorName').value = localStorage.getItem(OPERATOR_KEY) || 'local-user';
$('operatorName').onchange = e => localStorage.setItem(OPERATOR_KEY, e.target.value.trim() || 'local-user');
initTheme();
